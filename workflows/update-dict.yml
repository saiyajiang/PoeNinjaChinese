name: Update Dictionary

on:
  schedule:
    # 每周一 03:17 UTC 重新从 poedb.tw 拉一次词库
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build PoE1 dictionary (poedb.tw)
        run: node tools/build-dict.mjs --host https://poedb.tw

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dict.json data/dict.min.json
          if git diff --staged --quiet; then
            echo "词库无变化，跳过提交"
          else
            git commit -m "chore(dict): update $(date -u +%Y-%m-%d)"
            git push
          fi
