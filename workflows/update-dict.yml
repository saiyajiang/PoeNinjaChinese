name: Update Dictionary

on:
  schedule:
    # 每周一 03:17 UTC 重新构建词库
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 腾讯官方优先；国服接口要登录，用仓库 secret 传 POESESSID（没配就自动降级到 poedb）
      - name: Build dictionary (Tencent official first, PoEDB fallback)
        env:
          POESESSID: ${{ secrets.POESESSID }}
        run: |
          if [ -n "$POESESSID" ]; then
            node tools/build-dict.mjs --host https://poedb.tw --cookie "POESESSID=$POESESSID"
          else
            node tools/build-dict.mjs --host https://poedb.tw
          fi

      - name: Check inline blocks are in sync
        run: node tools/sync-inline.mjs --check

      - name: Smoke test
        run: node tools/smoke-test.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dict.json data/dict.min.json
          if git diff --staged --quiet; then
            echo "词库无变化，跳过提交"
          else
            git commit -m "chore(dict): update $(date -u +%Y-%m-%d)"
            git push
          fi
